<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxify Lounge</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Relaxify">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/pwa.css">
</head>
<body>
<div class="bg-wrap">
  <div class="launch-screen">
    <img src="/static/img/icon-192.png" alt="Relaxify Lounge" class="launch-logo">
    <h1>RELAXIFY LOUNGE</h1>
    <p id="launchMsg" class="launch-msg">Opening&hellip;</p>
    <div class="launch-spinner" id="launchSpinner"></div>
    <button type="button" id="launchRetry" class="launch-retry" style="display:none">Try again</button>
  </div>
</div>
<script src="/static/js/launch.js"></script>
<script src="/static/js/pwa.js" defer></script>
</body>
</html>
