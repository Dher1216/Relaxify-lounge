<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Relaxify Lounge</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Relaxify">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/pwa.css">
</head>
<body>
<div class="bg-wrap">
  <div class="login-screen">
    <div class="login-card">
      <img src="/static/img/logo.png" alt="Relaxify Lounge" class="logo">
      <h1>RELAXIFY LOUNGE</h1>
      <p class="tagline">RELAX MORE &bull; WORRY LESS</p>

      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

      <form method="post" action="/login" id="loginForm">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="loginPassword" required autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
        <button type="submit" id="loginBtn" style="width:100%">Login</button>
      </form>
    </div>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', function () {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerText = 'Logging in...';
  });
</script>
<script src="/static/js/login.js" defer></script>
<script src="/static/js/pwa.js" defer></script>
</body>
</html>
