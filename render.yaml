services:
  - type: web
    name: relaxify-lounge
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false   # set this manually in the Render dashboard to your Neon connection string
      - key: SECRET_KEY
        generateValue: true
